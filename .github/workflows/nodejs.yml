name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    node:
        name: Node.js
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24.18.0
                  cache: npm
            - name: Set up npm
              run: npm install --global npm@11.16.0
            - run: npm ci
            - run: npm run check
            - run: npm run typecheck
            - name: Test with coverage thresholds
              run: npm run test:coverage
            - run: npm run build
            - run: npm run smoke:node

    bun:
        name: Bun
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24.18.0
                  cache: npm
            - name: Set up npm
              run: npm install --global npm@11.16.0
            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - run: npm ci
            - name: Build with Bun
              run: bun run build
            - name: Smoke test with Bun
              run: npm run smoke:bun

    deno:
        name: Deno
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24.18.0
                  cache: npm
            - name: Set up npm
              run: npm install --global npm@11.16.0
            - name: Set up Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: 2.4.5
            - run: npm ci
            - name: Build with Deno task
              run: deno task build
            - name: Smoke test with Deno
              run: deno task smoke
